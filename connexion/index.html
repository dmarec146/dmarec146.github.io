<body>

<header class="site-entete">
  <div class="enveloppe">
    <a class="site-logo" href="../index.html">
      <span class="marque">Cahiers <em>interactifs</em></span>
    </a>
    <nav class="site-nav">
      <a href="../index.html">Accueil</a>
      <a class="nav-vedette" href="../cahiers/index.html">Cahiers de calcul</a>
      <a class="nav-vedette nav-vedette-vert" href="../automatismes/index.html">Automatismes</a>
      <a class="nav-vedette nav-vedette-anthracite" href="../qcm-bac/index.html">QCM Terminale</a>
    </nav>
  </div>
</header>

<div class="enveloppe">
  <div class="connexion-cadre">
    <h1>Connexion</h1>
    <p class="connexion-intro">Identifiant et mot de passe donnés par ton professeur.</p>

    <form id="form-connexion" novalidate>
      <div class="champ">
        <label for="pseudo">Identifiant</label>
        <input type="text" id="pseudo" name="pseudo" autocomplete="username" required autofocus>
      </div>
      <div class="champ">
        <label for="mot-de-passe">Mot de passe</label>
        <div class="champ-mot-de-passe">
          <input type="password" id="mot-de-passe" name="mot-de-passe" autocomplete="current-password" required>
          <button type="button" id="bouton-afficher-mdp" class="bouton-oeil" aria-pressed="false">Afficher</button>
        </div>
      </div>

      <p id="connexion-erreur" class="connexion-erreur" role="alert" hidden></p>

      <button type="submit" class="connexion-bouton">Se connecter</button>
    </form>
  </div>

  <!-- Bloc enseignant (activé le 28/10/2026) : mène à enseignant.html (quelques lignes et la demande d'accès par courriel). -->
  <a class="connexion-enseignant" href="enseignant.html">
    <span class="connexion-enseignant-texte">
      <strong>Vous êtes enseignant ?</strong>
      <span>Créez des devoirs pour vos élèves.</span>
    </span>
    <span class="connexion-enseignant-fleche" aria-hidden="true">→</span>
  </a>
</div>

<footer class="site-pied">
  Cahiers interactifs — ressources pour le lycée.
  <span class="site-pied-mention">Visites comptées anonymement, sans cookie.</span>
</footer>

</body>
</html>
